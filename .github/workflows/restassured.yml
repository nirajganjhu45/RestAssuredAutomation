name: Rest assured automation
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    -  name: checkout-code
       uses: actions/checkout@v4
    
    -  name: setup-java
       uses: actions/setup-java@v4

    - name: Run Maven Command
      run: mvn clean test

    - name: Run Maven Command
      run: mvn install

    
    
        


