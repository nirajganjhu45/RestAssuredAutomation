name: Rest assured automation
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    -  name: checkout-code
       uses: actions/checkout@v4
    
    - name: setup-java
      uses: actions/setup-java@v5
      with:
          distribution: 'temurin'     # or another distribution you prefer
          java-version: '17'         # set to the Java version your project needs

    - name: Build and test
      run: mvn -B -V clean install

    
    
        


